[project]
name = "legal-research"
version = "0.1.0"
description = "Agentic legal article generation pipeline — Research phase"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sse-starlette>=2.0,<3",

    # LangGraph
    "langgraph>=0.4,<1",
    "langgraph-checkpoint-postgres>=2.0,<3",

    # LLM
    "anthropic>=0.42,<1",

    # Search providers
    "tavily-python>=0.5,<1",
    "openai>=1.50,<2",          # Perplexity uses OAI-compatible API

    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",  # langgraph checkpoint needs psycopg3

    # Schemas & settings
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",

    # Text extraction
    "trafilatura>=1.12,<2",
    "beautifulsoup4>=4.12,<5",
    "pymupdf>=1.24,<2",

    # HTTP
    "httpx>=0.27,<1",

    # Fuzzy matching (grounding)
    "rapidfuzz>=3.9,<4",

    # Logging
    "structlog>=24.4,<25",

    # Utilities
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.8,<1",
    "vcrpy>=6.0,<7",
    "respx>=0.21,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
